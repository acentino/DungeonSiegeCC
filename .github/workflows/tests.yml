name: Test DungeonSiegeCC
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile application modules
        run: python -m py_compile importer.py manager.py update_helper.py mmd_assets.py game_pipeline.py asset_probe.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
