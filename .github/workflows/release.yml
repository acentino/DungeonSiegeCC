name: Publish Windows source release

on:
  push:
    branches: [main]
    paths:
      - RELEASE_VERSION
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify version and run regression tests
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, os.getcwd())
          import manager
          release_tag = Path("RELEASE_VERSION").read_text(encoding="utf-8").strip()
          assert release_tag == "v" + manager.VERSION, (release_tag, manager.VERSION)
      - name: Validate application source
        run: |
          python -m py_compile importer.py manager.py update_helper.py mmd_assets.py game_pipeline.py asset_probe.py ds2_tank.py logic_inspector.py
          python -m unittest discover -s tests -v
          python -c "import manager; manager.bundled_manifest(); print('Framework bundle checksum verified')"
      - name: Package offline-first Windows source application
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          files = ["importer.py", "manager.py", "update_helper.py", "mmd_assets.py", "game_pipeline.py", "asset_probe.py", "ds2_tank.py", "START_WINDOWS.bat", "README.md"]
          files += [p.as_posix() for p in Path("framework_bundle").rglob("*") if p.is_file()]
          with zipfile.ZipFile("DungeonSiegeCC-Windows.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for file in files:
                  archive.write(file)
          print("Packaged", len(files), "files")
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.4
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: DungeonSiegeCC-Windows.zip
